name: Sync EasyStore Products

on:
  workflow_dispatch:

  schedule:
    # 台灣時間每天 02:30
    - cron: '30 18 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl PAZUA and sync products
        env:
          SOURCE_SITE: https://pazua.easy.co
          SMART_PRICE_URL: ${{ secrets.SMART_PRICE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: node scripts/crawl.mjs --push
